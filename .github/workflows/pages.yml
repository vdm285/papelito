name: Pages

# Builds the static site and publishes it on GitHub Pages. Nothing is fetched at build time:
# the aisle dictionary and its sources are committed (docs/PIPELINES.md), so a source being
# down never blocks a deploy. A failing test or check fails the job before deploying, and the
# previous deployment stays live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node tools/vocab/check.mjs
      # The base is the repository's name, so a rename needs no edit here. GITHUB_REPOSITORY
      # ("owner/name") is set on every trigger; github.event.repository is absent from a scheduled
      # run's payload. The grep fails the job when the page does not load from that base.
      - run: |
          export VITE_BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "base path: $VITE_BASE"
          npm run build
          grep -q "${VITE_BASE}assets/" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
